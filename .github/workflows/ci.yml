name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    container: golang:1.27.1-bookworm
    steps:
      - uses: actions/checkout@v7
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1
      - run: go test -coverprofile=c.out ./internal/... -count=1 && go tool cover -func=c.out | awk '/^total:/ {print; if ($3+0 < 90) {print "coverage below 90%" > "/dev/stderr"; exit 1}}'
